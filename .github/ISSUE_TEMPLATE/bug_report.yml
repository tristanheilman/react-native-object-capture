name: 🐛 Bug report
description: Report a bug or regression in this library.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. The more of the below you can fill in, the
        faster it can be reproduced — capture bugs are device-specific, so the device and iOS
        version matter more here than in most libraries.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I tested with the latest version of the library.
          required: true
        - label: I checked for existing issues covering this.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: |
        What you expected, and what happened instead. Error messages, stack traces, screenshots
        or a screen recording all help.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      description: Capture behaviour varies by device. Simulator-only reports are fine — say so.
      placeholder: "iPhone 15 Pro, iOS 18.2"
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      placeholder: "x.x.x"
    validations:
      required: true
  - type: textarea
    id: react-native-info
    attributes:
      label: Environment info
      description: Output of `npx react-native info`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: reproducible-example
    attributes:
      label: Reproducible example
      description: |
        A link to a repository or a Gist with the relevant code, if you have one. Not required,
        but it makes a fix much more likely.
    validations:
      required: false
