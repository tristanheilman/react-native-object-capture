name: Release notes

# Regenerates a release's notes on demand, for any tag. New releases don't
# need this: their notes run as a separate job, so "Re-run failed jobs"
# retries them. It's for releases cut before that split (0.2.9 and earlier),
# where the notes step ran after `npm publish` in the same job and a re-run
# would try to publish the same version again.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to regenerate notes for (e.g. v0.2.9)
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Generate AI release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ai-release-notes.sh
