name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Never run two releases against main at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Maintains an always-open "Release PR" that bumps the version + CHANGELOG from
  # conventional commits. Merging that PR creates the git tag + GitHub Release and
  # sets release_created=true, which gates the publish job below.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Runs only when a release was just created (i.e. the Release PR was merged).
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the GitHub Release with AI-generated notes
      id-token: write # npm publish provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure npm registry auth
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      # Pre-publish safety gate — the fast checks only. The heavy iOS/Android
      # builds already ran on the PR; re-running them here would just duplicate
      # a green result. If any of these fail we do NOT publish.
      - name: Verify before publish
        run: |
          yarn lint
          yarn typecheck
          yarn test --maxWorkers=2

      - name: Build package
        run: yarn prepare

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Best-effort: replace the release body with human-readable notes written by
      # Claude. If it fails, the release keeps release-please's default notes.
      - name: Generate AI release notes
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ai-release-notes.sh
